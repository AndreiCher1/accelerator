version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: asr-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: supersecretpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  trt-llm:
    image: nvcr.io/nvidia/tensorrt-llm/release:latest 
    container_name: asr-trt-llm
    ports:
      - "8000:8000"
    volumes:
      - ./models/qwen3-engine:/engine 
    command: python3 -m tensorrt_llm.entrypoints.openai.api_server --engine_dir /engine --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  python-worker:
    build: 
      context: ./python-app
    container_name: asr-python-worker
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - TRT_LLM_URL=http://trt-llm:8000/v1/audio/transcriptions
      - MINIO_USER=admin
      - MINIO_PASSWORD=supersecretpassword
      - BUCKET_NAME=transcriptions
    volumes:
      - ./audio_input:/app/audio_input
    depends_on:
      - minio
      - trt-llm
    restart: unless-stopped

volumes:
  minio_data: